<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Éditeur d'événements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0b10;
      color: #f0f0f5;
      max-width: 720px;
      margin: 30px auto;
      padding: 0 16px;
    }
    h1 {
      color: #ffd166;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    h2 {
      color: #ffffff;
      font-size: 1.2rem;
      margin-top: 0;
    }
    .carte {
      background: #161622;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 22px;
    }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #c8c8d8;
    }
    input {
      width: 100%;
      margin-top: 5px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #0b0b10;
      color: #ffffff;
      font-size: 0.95rem;
    }
    input:focus {
      outline: none;
      border-color: #ffd166;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-ajouter {
      background: #ffd166;
      color: #0b0b10;
    }
    .btn-enregistrer {
      background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%);
      color: #ffffff;
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      font-size: 1rem;
    }
    .evenement-ligne {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .evenement-ligne:last-child {
      border-bottom: none;
    }
    .btn-supprimer {
      background: #2e181e;
      color: #ff8a93;
      border: 1px solid rgba(255, 94, 98, 0.35);
      padding: 7px 12px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .btn-supprimer:hover {
      background: #ff5e62;
      color: #ffffff;
    }
    .message {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #ffd166;
      min-height: 20px;
    }
    .vide {
      color: #8e8ea6;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Gestion des événements</h1>

  <div class="carte">
    <h2>Message lorsqu'il n'y a pas d'événement</h2>
    <label>
      Texte affiché si la liste est vide (ou entrée « message seul »)
      <input type="text" id="message-aucun-evenement" placeholder="ex. Pas de concert prévu pour le moment, nouvelles dates très bientôt !">
    </label>
  </div>

  <div class="carte">
    <h2>Nouvel événement ou message seul</h2>
    <form id="form-evenement">
      <label>
        Date
        <input type="text" id="date" placeholder="ex. 20-11-2026">
      </label>
      <label>
        Lieu
        <input type="text" id="lieu" placeholder="ex. Paris 20ième – Chez Bistouille">
      </label>
      <label>
        Description
        <input type="text" id="desc" placeholder="ex. Soirée Funk">
      </label>
      <label>
        Message seul (optionnel, sans date ni lieu)
        <input type="text" id="message-seul" placeholder="ex. Nouvelles dates à venir très bientôt !">
      </label>
      <label>
        Lien Lylo (optionnel)
        <input type="url" id="lylo" placeholder="https://www.lylo.fr/...">
      </label>
      <label>
        Lien InfoConcert (optionnel)
        <input type="url" id="infoconcert" placeholder="https://www.infoconcert.com/...">
      </label>
      <button type="submit" class="btn-ajouter">Ajouter événement</button>
    </form>
  </div>

  <div class="carte">
    <h2>Événements enregistrés</h2>
    <div id="liste-evenements"></div>
    <button type="button" id="btn-enregistrer" class="btn-enregistrer">
      Enregistrer le .js généré (evenements-data.js)
    </button>
    <div id="message" class="message"></div>
  </div>

  <!-- Chargement local sans fetch -->
  <script src="evenements-data.js"></script>
  <script>
    const MESSAGE_DEFAUT = "Pas de concert prévu pour le moment, nouvelles dates très bientôt !";

    let listeEvents = (typeof events !== "undefined" && Array.isArray(events))
      ? events.map(e => ({ ...e }))
      : [];

    const msgVideInput = document.getElementById("message-aucun-evenement");
    msgVideInput.value = (typeof messageSansEvenement === "string" && messageSansEvenement.trim())
      ? messageSansEvenement.trim()
      : MESSAGE_DEFAUT;

    const listeEl = document.getElementById("liste-evenements");
    const messageEl = document.getElementById("message");

    function estMessageSeul(ev) {
      return Boolean(ev && ev.message && !ev.date && !ev.lieu && !ev.desc);
    }

    function afficherListe() {
      if (listeEvents.length === 0) {
        const msgActuel = msgVideInput.value.trim() || MESSAGE_DEFAUT;
        listeEl.innerHTML = `<p class="vide">Aucun événement — message affiché : « ${msgActuel} »</p>`;
        return;
      }

      listeEl.innerHTML = "";
      listeEvents.forEach((ev, index) => {
        const ligne = document.createElement("div");
        ligne.className = "evenement-ligne";

        const infos = document.createElement("div");
        if (estMessageSeul(ev)) {
          infos.innerHTML = `<em>${ev.message}</em>`;
        } else {
          infos.innerHTML = `<strong>${ev.date || ""}</strong> – ${ev.lieu || ""}<br><em>${ev.desc || ""}</em>`;
        }

        const btnSuppr = document.createElement("button");
        btnSuppr.type = "button";
        btnSuppr.className = "btn-supprimer";
        btnSuppr.textContent = "Supprimer événement";
        btnSuppr.addEventListener("click", () => {
          listeEvents.splice(index, 1);
          afficherListe();
          messageEl.textContent = "Événement supprimé (pensez à enregistrer le .js).";
        });

        ligne.appendChild(infos);
        ligne.appendChild(btnSuppr);
        listeEl.appendChild(ligne);
      });
    }

    msgVideInput.addEventListener("input", () => {
      if (listeEvents.length === 0) {
        afficherListe();
      }
      messageEl.textContent = "Message mis à jour (pensez à enregistrer le .js).";
    });

    document.getElementById("form-evenement").addEventListener("submit", (e) => {
      e.preventDefault();

      const date = document.getElementById("date").value.trim();
      const lieu = document.getElementById("lieu").value.trim();
      const desc = document.getElementById("desc").value.trim();
      const msgSeul = document.getElementById("message-seul").value.trim();
      const lylo = document.getElementById("lylo").value.trim();
      const infoconcert = document.getElementById("infoconcert").value.trim();

      let nouvelEvent;
      if (msgSeul && !date && !lieu && !desc) {
        nouvelEvent = { message: msgSeul };
      } else {
        if (!date || !lieu || !desc) {
          alert("Renseignez soit un « Message seul », soit la date, le lieu et la description.");
          return;
        }
        nouvelEvent = { date, lieu, desc };
        if (msgSeul) nouvelEvent.message = msgSeul;
        if (lylo) nouvelEvent.lylo = lylo;
        if (infoconcert) nouvelEvent.infoconcert = infoconcert;
      }

      listeEvents.push(nouvelEvent);
      afficherListe();

      e.target.reset();
      messageEl.textContent = "Événement ajouté (pensez à enregistrer le .js).";
    });

    function genererContenuJs() {
      const msgFinal = (msgVideInput.value.trim() || MESSAGE_DEFAUT).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      return (
        `const messageSansEvenement = "${msgFinal}";\n\n` +
        `const events = ${JSON.stringify(listeEvents, null, 4)};\n`
      );
    }

    function telechargementClassique(contenu) {
      const blob = new Blob([contenu], { type: "application/javascript;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const lien = document.createElement("a");
      lien.href = url;
      lien.download = "evenements-data.js";
      document.body.appendChild(lien);
      lien.click();
      lien.remove();
      URL.revokeObjectURL(url);
      messageEl.textContent = "Fichier evenements-data.js généré ! Placez-le dans le dossier du site.";
    }

    document.getElementById("btn-enregistrer").addEventListener("click", async () => {
      const contenu = genererContenuJs();

      if (typeof window.showSaveFilePicker === "function") {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: "evenements-data.js",
            types: [{
              description: "Fichier JavaScript",
              accept: { "application/javascript": [".js"] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(contenu);
          await writable.close();
          messageEl.textContent = "Fichier evenements-data.js enregistré avec succès !";
          return;
        } catch (err) {
          if (err && err.name === "AbortError") {
            messageEl.textContent = "Enregistrement annulé.";
            return;
          }
        }
      }

      telechargementClassique(contenu);
    });

    afficherListe();
  </script>
</body>
</html>
